name: tshirt_hook_three_screws
assumptions:
  - "Three screws instead of two: one at the top (y = 0, z = 30) and two at the bottom (y = -10 and y = +10, z = -20)."
  - "Each screw has the same clearance as the plain hook: a 4.5 mm shaft hole and a 9 mm channel for the head and the screwdriver, through the full part depth."
  - "The shirt is 0.2 kg x 9.81 = 1.96 N down. The abuse case is a 30 N pull, 45 degrees down and out of the wall (as the plain hook)."
regions:
  design:
    - prism: {plane: xz, extent: [-14, 14], points: [[2,-30],[72,8],[72,11],[56,15],[2,36]]}
  fixed:
    wall_plate:
      - box: {min: [0,-17.5,-30], max: [3.5,17.5,36]}
  keep_out:
    screw_hole_top:
      - cylinder: {p0: [-1,0,30], p1: [4,0,30], radius: 2.25}
      - cylinder: {p0: [3.5,0,30], p1: [80,0,30], radius: 4.5}
    screw_hole_bottom_left:
      - cylinder: {p0: [-1,-10,-20], p1: [4,-10,-20], radius: 2.25}
      - cylinder: {p0: [3.5,-10,-20], p1: [80,-10,-20], radius: 4.5}
    screw_hole_bottom_right:
      - cylinder: {p0: [-1,10,-20], p1: [4,10,-20], radius: 2.25}
      - cylinder: {p0: [3.5,10,-20], p1: [80,10,-20], radius: 4.5}
  load:
    hook_tip:
      - box: {min: [56,-9,11], max: [76,9,15]}
      - box: {min: [73,-9,11], max: [76,9,24]}
load_cases:
  - {name: hang, weight: 234.0, forces: [{region: hook_tip, force: [0,0,-1.96]}]}
  - {name: pull_off, weight: 1.0, forces: [{region: hook_tip, force: [20.89,5.21,-20.89]}]}
settings: {volume_fraction: 0.2, iterations: 80, voxel_size: 1.5}
