name: tshirt_hook_jacket
regions:
  design: design.stl
  fixed: [wall_plate.stl]
  keep_out: [screw_hole_top.stl, screw_hole_bottom.stl]
  load: {hook_tip: hook_tip.stl}
load_cases:
- name: hang
  weight: 25.0
  forces:
  - region: hook_tip
    force: [0, 0, -19.62]
- name: pull_off
  weight: 1.0
  forces:
  - region: hook_tip
    force: [68.31, 17.03, -68.31]
material: {E: 3500.0, nu: 0.35, density: 1.24}
settings: {voxel_size: 1.5, volume_fraction: 0.3, iterations: 80}
assumptions: ['The hook holds a 2 kg jacket: 2 x 9.81 = 19.62 N down (the plain hook
    holds a 0.2 kg shirt).', 'Abuse case: a pull of 5 times the static force, 98.1
    N, in the direction of the plain hook (45 degrees down and out of the wall, 10
    degrees to the side).', 'The static case weight is (98.1 / 19.62)^2 = 25, so that
    both cases have the same share of the objective (the rule of the plain hook).',
  'Volume fraction 0.3 (the plain hook has 0.2): the abuse load is big.', 'Plate,
    screws, saddle and lip are as in the plain hook.']
