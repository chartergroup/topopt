[legs.linux-x86_64-intel-pins]
# The Linux leg with the pins of the Intel Mac lock (numpy 2.3.5, numba 0.62.1, llvmlite 0.45.1, cryptography 48.0.1). It answers: does the code
# still work with the older pins that an Intel Mac installs? It is the Linux leg in every other key, and a test checks that. It runs with the
# choice `all` of a manual run only (CONTRACTS.md 27.10). The short run compares with the same golden file at
# tier cross: a hosted runner is not the machine that made it. The strict compare on one machine (tier bit) is a local job.
runner = "ubuntu-24.04"
# stage 2: the workflow starts this leg only after every leg of stage 1 (linux-x86_64) has passed (CONTRACTS.md 27.3). A leg without `stage` is in stage 1.
stage = 2
on_pull_request = false
# Python 3.13 only, as the other legs (2026-10-27). The launcher makes Python 3.13 on an Intel Mac too; the Intel pins have wheels for 3.13 (the lock
# check resolves the Intel lock for it).
pythons = ["3.13"]
# 2 jobs in the full tier, as the Linux leg. In the fast tier this leg runs no pytest (pytest_fast = "none"), and plan_legs.py --tier makes one job.
shards = 2
lock = "requirements-macos-x86_64.lock"
install_mode = "lock-first"
extras = ["dev", "mcp", "pardiso", "step", "tet", "verify"]
expect_solver = "pardiso"
system_packages = ["libglu1-mesa", "libopengl0", "libxft2", "libxinerama1", "libxcursor1", "libxfixes3", "libxext6", "libgl1"]
build_shim = false
tier = "cross"
short_run_limit_s = 300
pytest_workers = "auto"
pytest_threads = 1
# Fast tier: no pytest (install, licence, solver, locks and the short run still run). Full tier: the tests without the slow ones. This leg differs from linux-x86_64 only in the package pins. See CONTRACTS.md 27.3.
pytest_fast = "none"
pytest_full = "not slow"

