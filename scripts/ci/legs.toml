# The CI legs, the tolerance tiers and the allowed skips (CONTRACTS.md section 27).
# The scripts in scripts/ci/ read this file. The workflow file holds only the runner names. The workflow file is
# .github/workflows/tests.yml, started by hand only (workflow_dispatch; its input `legs` is `linux` or `all`) (CONTRACTS.md 27.1).
# tests/test_ci_scripts.py checks that the workflow, this file and CONTRACTS.md agree.
#
# Keys of a leg that are not required (CONTRACTS.md 27.10):
#   lock         the lock file of the install, a path relative to the repo (default requirements.lock)
#   install_mode "project" (default): uv pip install -c <lock> -e ".[extras]". "lock-first": uv pip install --only-binary numba --only-binary llvmlite
#                --only-binary cryptography -r <lock>, then -e . with --no-deps --no-build-isolation, then the requirements of the extras with -c <lock>. This is close to the
#                install of the launcher on an x86_64 Mac, not equal (scripts/ci/install_env.py; the list of differences is in CONTRACTS.md 27.10): the
#                launcher installs no extra and has a fallback that the leg does not test. (The launcher on main before PR #50 spells the flags --no-build-package,
#                which uv pip install rejects; PR #50 changes it to --only-binary, as the leg has it.)
#                A Linux leg needs it with the Intel lock: the markers of pyproject.toml ask for numba 0.67.0 there, and the lock holds 0.62.1.
#   on_pull_request  the name is historic (no workflow runs on a pull request any more). true (the default) = the leg is in the choice
#                `linux` of the input `legs`, so `linux` and `all` run it; false = the leg runs with `all` only (it takes more runner time, or it is a second
#                Linux leg). scripts/ci/plan_legs.py reads it.
#   workflow     the workflow that runs the leg (default "tests" = .github/workflows/tests.yml; "intel-mac" = intel-mac.yml,
#                which starts by hand only). scripts/ci/plan_legs.py --workflow <name> writes the matrix of that workflow.
#   check_locks  true: the step scripts/ci/check_locks.py runs on this leg (the lock files resolve for their platforms)
#   pythons      REQUIRED. The Python versions that the leg runs, for example ["3.13"]. Each one is in SUPPORTED_PYTHONS (scripts/ci/_common.py, the one
#                place that names the supported versions; pyproject.toml `requires-python` allows exactly those). scripts/ci/plan_legs.py makes one matrix
#                entry for each version, so a leg with two versions is two jobs and takes twice the runner time. A leg that lists only "3.13" runs on the Python of the launcher (LAUNCHER_PYTHON in scripts/topopt-env.sh).
#   shards       the number of parallel jobs that share the pytest run of the leg for each Python (a whole number of 1 or more; default 1 = no split). scripts/ci/plan_legs.py
#                makes one matrix entry for each Python and shard. The test files are split by their measured times (tests/tiers/durations.json, scripts/ci/shards.py), the
#                same set of tests runs, and the job `report` of tests.yml checks that. The licence check, the lock check and the short run run on shard 1 only.
#                Each shard pays its own setup, so a leg on a runner that counts more per minute (macOS) has fewer shards.

# --- tolerance tiers of the golden compare --------------------------------------------------------
# A metric passes when |measured - golden| <= atol + rtol * |golden|.
# `atol` of volume and mass is the rounding step of the number in result/metrics.json (topopt/post.py:327-330:
# volume_final_mm3 has 1 decimal, mass_final_g has 2 decimals).

[tiers.bit]
# The same machine, the same pins, the same thread count: the numbers repeat exactly.
# Basis: four runs of the short hook run at 1 thread on one Linux host gave equal numbers.
compliance_final = { rtol = 0.0, atol = 0.0 }
volume_fraction_final = { rtol = 0.0, atol = 0.0 }
volume_final_mm3 = { rtol = 0.0, atol = 0.0 }
mass_final_g = { rtol = 0.0, atol = 0.0 }

[tiers.cross]
# Another CPU, another operating system or another direct solver library (PARDISO against Accelerate).
# Basis: the measured deviations in CONTRACTS.md section 27.5.
compliance_final = { rtol = 1e-8, atol = 0.0 }
volume_fraction_final = { rtol = 1e-8, atol = 0.0 }
volume_final_mm3 = { rtol = 1e-6, atol = 0.1 }
mass_final_g = { rtol = 1e-6, atol = 0.01 }

# --- legs -------------------------------------------------------------------------------------------

[legs.linux-x86_64]
runner = "ubuntu-24.04"
# The Linux leg is in the choice `linux` (the default of a manual run). A person starts it: no push or pull request does.
on_pull_request = true
# Python 3.13 only. The launcher makes Python 3.13 (#422), the Python of this leg, and the package supports 3.13 only. The lock
# check of this leg resolves the locks for every supported Python (check_locks.py without --python).
pythons = ["3.13"]
# Parallel jobs for the pytest run (CONTRACTS.md 27.3.2): 2 jobs for each Python. A standard runner has 2 CPUs and the fast tier took 27.5 min there
# in one job. With 2 jobs the longest job takes about 12 to 13 min (measured); with 4 jobs it takes about 6.4 to 7.2 min (estimate), and the sum
# of the runner time is a little higher.
shards = 2
# Extras to install. An extra that pyproject.toml does not declare is dropped and named in the log
# (the extra `verify` comes with PR #21). No `gpu` extras (GOAL: no OpenCL in CI).
# The extra `step` (OpenCASCADE wheel `cadquery-ocp-novtk`) is on every leg: the licence step reads it and the tests with the marker
# `needs_ocp` run. PyPI has a cp313 wheel for each leg platform (manylinux_2_31 x86_64, macosx_11_0 arm64 and x86_64). The extra is not in the lock files, as gmsh is not.
extras = ["dev", "mcp", "pardiso", "step", "tet", "verify"]
expect_solver = "pardiso"
# The lock check (network, uv) runs on this leg: it resolves both lock files for their platforms (scripts/ci/check_locks.py).
check_locks = true
# apt packages that the gmsh wheel needs on a headless Linux (tests/test_tet.py runs gmsh). libgmsh.so also
# needs libXcursor, libXfixes, libXext and libGL (the ubuntu-24.04 image has them today; the list names them
# so that the leg does not depend on what else the image holds).
system_packages = ["libglu1-mesa", "libopengl0", "libxft2", "libxinerama1", "libxcursor1", "libxfixes3", "libxext6", "libgl1"]
build_shim = false
tier = "cross"
# The short hook run (one thread). Linux x86_64 PARDISO measured about 20 s.
short_run_limit_s = 300
# The full pytest step runs in parallel with pytest-xdist (scripts/ci/run_pytest.py). Workers: `auto` is one worker for each
# usable CPU. Threads: the cap for BLAS, OpenMP and numba in each worker (OMP_NUM_THREADS, MKL_NUM_THREADS, OPENBLAS_NUM_THREADS,
# NUMBA_NUM_THREADS), because the threads of all workers multiply. Measured on 4 CPUs (taskset -c 0-3, 4 workers): 619 s with
# 1 thread, 646 s with 2 threads, 757 s with no cap. 1 thread: workers x threads = CPUs.
pytest_workers = "auto"
pytest_threads = 1
# Fast tier: every test that took under 5 s in the CI run of 2026-10-25 (tests/tiers/slow.txt). Full tier: all tests. See CONTRACTS.md 27.3.
pytest_fast = "not slow"

