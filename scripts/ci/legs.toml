[legs.macos-arm64]
# macos-15 (arm64, 3 M1 cores, 7 GB). The label macos-14 is deprecated: GitHub retires
# the image on 2026-11-02 and fails the jobs of that label in brownouts before (2026-10-23, 26, 29 and 30, 14:00 to
# 24:00 UTC). Source: github.com/actions/runner-images issue 13518, read on 2026-10-20.
runner = "macos-15"
# stage 2: the workflow starts this leg only after every leg of stage 1 (linux-x86_64) has passed (CONTRACTS.md 27.3). A leg without `stage` is in stage 1.
stage = 2
# A macOS runner minute counts more than a Linux minute, so this leg runs with the choice `all` of a manual run only. Set this value to true
# to put it in the choice `linux`.
on_pull_request = false
# Python 3.13 only, as the Linux leg (2026-10-27): the choice `all` runs this leg once.
pythons = ["3.13"]
# 2 jobs for each Python. A macOS minute counts more than a Linux minute, and each job pays its own setup (about 1.5 min), so more than 2 shards would use more runner time than they save.
shards = 2
extras = ["dev", "mcp", "step", "tet", "verify"]
expect_solver = "cholesky"
system_packages = []
# The Accelerate shim is built before the tests (sh topopt/native/build.sh).
build_shim = true
tier = "cross"
short_run_limit_s = 300
# Same meaning as in the Linux leg. The macOS runner has 3 cores. Not measured on a Mac.
pytest_workers = "auto"
pytest_threads = 1
# Fast tier: the tests of the files that can differ on macOS (tests/tiers/platform_files.txt), without the slow ones. A macOS minute counts more than a Linux minute, so the full tier of this leg is for a big release only. See CONTRACTS.md 27.3.
pytest_fast = "platform_sensitive and not slow"

