[legs.macos-x86_64]
# A hosted Intel Mac runner, started by hand (workflow_dispatch of .github/workflows/intel-mac.yml). Nothing ran on it yet (CONTRACTS.md 27.10).
# macos-15-intel: x64, 4 vCPU, 14 GB. GitHub ends the Intel architecture on macOS after the macOS 15 image is retired in fall 2027;
# macos-26-intel is the option (no end date found, 2026-10-21; it may be the same).
runner = "macos-15-intel"
workflow = "intel-mac"
# Not used (the workflow runs on workflow_dispatch only); the key keeps every leg complete.
on_pull_request = false
# 3.13 only, as the Intel-pins leg (intel-mac.yml makes its venv with `matrix.python`; a test checks that the two agree).
pythons = ["3.13"]
# One job: intel-mac.yml starts by hand, and nothing has run on this runner yet.
shards = 1
lock = "requirements-macos-x86_64.lock"
install_mode = "lock-first"
extras = ["dev", "mcp", "step", "tet", "verify"]
# `auto` gives amg on an x86_64 Mac (CONTRACTS.md section 28).
expect_solver = "amg"
system_packages = []
# The Accelerate shim is not built: it is for Apple silicon, and `cholesky` is a user error here.
build_shim = false
# The golden file is from Linux with PARDISO. Linux PARDISO against AMG measured 9.6e-10 in compliance, inside tier cross.
tier = "cross"
# The values below copy the other legs. Not measured on an Intel Mac: the first run gives the first time.
short_run_limit_s = 300
pytest_workers = "auto"
pytest_threads = 1
# Same tiers as macos-arm64 (this leg runs from intel-mac.yml, which passes no tier: it runs the full tier). See CONTRACTS.md 27.3.
pytest_fast = "platform_sensitive and not slow"

