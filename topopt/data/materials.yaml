# Filament catalog of topopt (CONTRACTS.md section 18.8). Read by topopt/materials_catalog.py. Format 1.
#
# Sources. Every number is a fact that the maker states on the data sheet or the product page named in `source_url`
# (or, for one field, in `field_sources`). The pages were opened on the date in `opened`. `tag: maker TDS` is a data
# sheet of the maker. `tag: maker page` is a product page of the maker (the Elegoo spec box). `tag: third party` is a
# copy of a maker sheet that another company hosts. One row is one product and one sheet version: a product with two
# sheet versions has two rows. A value that no source states, that two sources state differently, or that the sheet
# gives in a way that does not fit the field is `null`, and `note` says why (the note names every field that is null).
# Nothing is guessed. Every sheet says its numbers are not for design; the values describe printed test bars of one
# maker and one set of print settings, not your part.
#
# Licence. This file is our own list of facts, written by hand from maker sheets; it is MIT like the rest of topopt.
# It holds NO data of a slicer profile set: OrcaSlicer, Bambu Studio, PrusaSlicer and SuperSlicer profiles are
# AGPL-3.0, Cura profiles are LGPL-3.0, and nothing from them is copied here. The file has no price.
#
# Fields of a filament:
#   id                     lower-case slug; the value of `material.filament`
#   family                 ABS, ASA, PC, PA6-CF, ... (a label for people and for the pick list)
#   maker, product         the display name is "<maker> <product>"
#   aliases                other exact names (the maker words of the `makers` table are stripped before the compare)
#   sheet_version          the version that the sheet prints (the file name can say another one)
#   E_xy_mpa, E_z_mpa      tensile modulus, MPa. XY: the load runs in the layer plane. Z: the load runs across the layers.
#                          A Prusament "vertical xz" bar loads the layer plane: it is NOT a Z value, and Z is null.
#   bending_modulus_xy_mpa, bending_modulus_z_mpa  bending (flexural) modulus of printed bars, MPa, with the same XY and Z meaning.
#                          Entered only for a row whose sheet gives no tensile modulus and gives a bending modulus of printed bars
#                          (a run takes E from it, and says so); null in every other row.
#   strength_xy_mpa, strength_z_mpa  tensile strength of printed bars, MPa
#   strength_kind          yield | peak | not stated (what the sheet calls the number; most sheets do not say)
#   elongation_xy_pct      elongation of the XY bar, %
#   density_g_cm3          g/cm3. Null when the sheet gives a range and no single value
#   density_range_g_cm3    optional: [min, max] g/cm3 of a sheet that gives a range and no single density (then `density_g_cm3` is
#                          null). A run takes the middle of the range, and says so; the family median is only for a sheet with neither
#   hdt_18_c, hdt_045_c    heat deflection temperature at 1.8 MPa and at 0.45 MPa, deg C
#   conditioned            wet values of a polyamide: condition, strength_xy_mpa, strength_z_mpa, E_xy_mpa, E_z_mpa
#   nu                     Poisson's ratio: no sheet gives it, so it is null in every row
#   nozzle_c, bed_c        [min, max] deg C for a 0.4 mm nozzle; "x +/- y" on a sheet is stored as [x - y, x + y]
#   enclosure              "no" | recommended | required (what the maker says about an enclosed printer)
#   chamber_c_min          the lowest chamber temperature that the maker names as a need of the filament, deg C. It is entered for a
#                          filament with `enclosure: required`, and for Prusament PA11 (its sheet gives the chamber as a need). A chamber
#                          that a sheet lists only among its print conditions, for a filament whose enclosure is `no` or `recommended`,
#                          is not entered (Bambu Lab PETG Basic, PETG-CF and PET-CF). Null when the maker names none.
#   hardened_nozzle        true when the maker asks for a hardened or wear-resistant nozzle, false when it says not needed,
#                          null when the sheet does not say
#   drying                 text: the maker's drying setting; null when the sheet does not give one
#   direct_drive           true when the maker recommends a direct drive extruder; null when no source of this list says
#                          so (every row)
#   abrasive               true when the product holds carbon or glass fibre (the product name says so)
#   soft                   true for a rubber-like filament (TPU): a linear model does not fit it
#   source_url, opened, tag  where the row comes from, when it was opened, and what kind of page it is
#   field_sources          optional: a field -> the page for that one field, when it is not `source_url`
#   superseded_by          optional: the id of the row of a NEWER sheet of the same product (the row is an older sheet). A list shows
#                          the newer row and counts this one; its id still selects it, and a check says that a newer sheet exists
#   enclosed_note          optional: what the sheet or the product page of this one product says about printing in an enclosed printer,
#                          in its words. A check gives `care` with this text on an enclosed or heated printer. Only where the page says it
#   note                   text; required when a field is null (it names the field)

format: 1
catalog_version: "2026-10-25"

# Words that name a maker. The display name of the maker counts too. A maker word in a name is a hard filter.
makers:
  Polymaker: [polymaker]
  Bambu Lab: [bambu, bambulab, bambu lab, bbl]
  Prusament: [prusament, prusa, prusa research]
  Elegoo: [elegoo]
  eSun: [esun, e-sun]
  AzureFilm: [azurefilm, azure film]

