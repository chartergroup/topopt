# Printer catalog of topopt (CONTRACTS.md section 18.7). Read by topopt/printers.py. Format 1.
#
# Sources. Every number is a fact that the maker states on the page named in `source_url` (or, for one field, in
# `field_sources`). The pages were opened on the date in `opened`. `tag: maker doc` means a page of the maker of the
# printer. A value that no maker page states, or that two maker pages state differently, is `null`, and `note` says why
# (the note names every field that is null). Nothing is guessed.
#
# Licence. This file is our own list of facts, written by hand from maker pages; it is MIT like the rest of topopt.
# It holds NO data of a slicer profile set: OrcaSlicer, Bambu Studio, PrusaSlicer and SuperSlicer profiles are
# AGPL-3.0, Cura profiles are LGPL-3.0, and nothing from them is copied here. A printer name names a product.
#
# Fields of a model:
#   id                     lower-case slug; the value of `print.printer_model`
#   vendor, model          the display name is "<vendor> <model>"
#   aliases                other exact names (the vendor words of the `vendors` table are stripped before the compare)
#   printer_type           fdm | sla | lpbf | sls (the values of `print.printer_type`)
#   bed_mm                 [x, y] build plate, mm
#   build_height_mm        build height (z), mm
#   nozzle_mm              stock nozzle diameter, mm; nozzle_options_mm: the sizes that the maker sells for it
#   max_nozzle_c, max_bed_c  maximum temperatures that the maker states, deg C
#   enclosure              open | enclosed | heated (heated: the maker states active chamber heating)
#   chamber_max_c          the maximum active chamber temperature that the maker states; null when none is stated
#   stock_nozzle_material  brass | stainless | hardened_steel (the nozzle that ships with the printer)
#   extruder               direct | bowden
#   source_url, opened, tag  where the row comes from, when it was opened, and what kind of page it is
#   field_sources          optional: a field -> the page for that one field, when it is not `source_url`
#   note                   optional text; required when a field is null (it names the field)

format: 1
catalog_version: "2026-10-24"

# Words that name a vendor. The display name of the vendor counts too. A vendor word in a name is a hard filter.
vendors:
  Bambu Lab: [bambu, bambulab, bambu lab, bbl]
  Prusa: [prusa, original prusa, prusa research, prusa3d]
  Creality: [creality]
  Elegoo: [elegoo]
  Voron: [voron, voron design]

