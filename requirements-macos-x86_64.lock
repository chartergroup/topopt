# Pins for macOS x86_64 (an Intel Mac, or an x86_64 Python under Rosetta). Best effort: tested on Linux x86_64
# only, not on a Mac. The launcher (scripts/topopt-env.sh) uses this file on that platform, and requirements.lock
# everywhere else.
#
# This file is requirements.lock with four pins moved back. Each of the four has no macOS x86_64 wheel (Python 3.12)
# at the pin of requirements.lock. Sources: PyPI JSON and `uv pip compile --python-platform x86_64-apple-darwin --no-build`
# on 2026-10-20.
#   numba 0.67.0 -> 0.62.1        last numba with a macOS x86_64 wheel (macosx_10_15). It needs numpy < 2.4.
#   llvmlite 0.49.0 -> 0.45.1     last llvmlite with one (macosx_10_15). numba 0.62.1 needs llvmlite < 0.46.
#   numpy 2.5.3 -> 2.3.5          numba 0.62.1 needs numpy < 2.4. The wheel has macosx_10_13_x86_64.
#   cryptography 50.0.2 -> 48.0.1 last cryptography with one (macosx_10_9_universal2). It is under mcp (pyjwt).
# Every other pin is the same as in requirements.lock and has a macOS x86_64 wheel or is pure Python.
# To make the file again: change the four pins in a copy of requirements.lock, then check that this passes:
#   uv pip compile <copy> --python-platform x86_64-apple-darwin --python-version 3.12 --no-build
# The hook default run with these versions on Linux x86_64 is bit-equal to the run with requirements.lock.
